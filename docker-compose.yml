services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: grannus-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENV=${ENV:-development}
      - SARVAM_API_KEY=${SARVAM_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-}
      - PHI_ENCRYPTION_KEY=${PHI_ENCRYPTION_KEY:-}
      - AUDIO_RETENTION_HOURS=${AUDIO_RETENTION_HOURS:-72}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - SMS_PROVIDER=${SMS_PROVIDER:-console}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER:-}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER:-}
      - ALLOW_DEV_OTP=${ALLOW_DEV_OTP:-false}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - grannus-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: grannus-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - grannus-network

networks:
  grannus-network:
    driver: bridge
